<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贾生的空间</title>
<link rel="stylesheet" href="./Style.css">
<link rel="icon" href="./icon.ico" type="image/x-icon">
</head>
<body>
<header class="site-header">
<div class="container">
<h1 class="site-title"><a href="#">贾生的空间</a></h1>
<nav class="site-nav">
<a href="mailto:SonettoSakuraba@icloud.com">SonettoSakuraba@iCloud.com</a>
<button class="menu-toggle" type="button" aria-label="展开菜单" aria-expanded="false"></button>
</nav>
</div>
</header>

<main class="site-main">
<section id="posts" class="posts-section">
<div class="container">
<div id="posts-list"></div>
</div>
</section>
</main>

<script>
fetch("./text.json")
	.then(response => {
		if (!response.ok) {
			throw new Error("无法读取 text.json");
		}
		return response.json();
	})
	.then(posts => {
		const postsList = document.getElementById("posts-list");
		const postsToRender = (Array.isArray(posts) ? posts : [posts])
			.filter(post => post && post.title && post.date)
			.sort((firstPost, secondPost) =>
				new Date(secondPost.date) - new Date(firstPost.date)
			);

		postsToRender.forEach(post => {
			const article = document.createElement("article");
			article.className = "post";

			const title = document.createElement("h2");
			title.className = "post-title";
			title.textContent = post.title;

			const date = document.createElement("div");
			date.className = "post-meta";
			date.textContent = post.date;

			const content = document.createElement("div");
			content.className = "post-content";
			const paragraphs = Array.isArray(post.body) ? post.body : [];
			paragraphs.forEach(paragraph => {
				const element = document.createElement("p");
				element.innerHTML = paragraph;
				content.appendChild(element);
			});

			article.append(title, date, content);
			postsList.appendChild(article);
		});
	})
	.catch(error => {
		document.getElementById("posts-list").textContent = error.message;
	});
</script>
<script>
const menuToggle = document.querySelector(".menu-toggle");
const siteNav = document.querySelector(".site-nav");
const siteHeader = document.querySelector(".site-header");

menuToggle.addEventListener("click", () => {
	const isExpanded = menuToggle.getAttribute("aria-expanded") === "true";
	menuToggle.setAttribute("aria-expanded", String(!isExpanded));
	menuToggle.setAttribute("aria-label", isExpanded ? "展开菜单" : "收起菜单");
	siteNav.classList.toggle("is-open", !isExpanded);
	siteHeader.classList.toggle("is-open", !isExpanded);
});
</script>
</body>
</html>
