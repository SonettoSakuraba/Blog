<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贾生的空间</title>
<link rel="stylesheet" href="./Style.css">
</head>
<body>
<header class="site-header">
<div class="container">
<h1 class="site-title"><a href="#">贾生的空间</a></h1>
<nav class="site-nav">
<a href="mailto:SonettoSakuraba@icloud.com">SonettoSakuraba@iCloud.com</a>
</nav>
</div>
</header>

<main class="site-main">
<section id="posts" class="posts-section">
<div class="container">
<div id="posts-list"></div>
</div>
</section>
</main>

<script>
fetch("./text.json")
	.then(response => {
		if (!response.ok) {
			throw new Error("无法读取 text.json");
		}
		return response.json();
	})
	.then(posts => {
		const postsList = document.getElementById("posts-list");
		const postsToRender = (Array.isArray(posts) ? posts : [posts])
			.filter(post => post && post.title && post.date)
			.sort((firstPost, secondPost) =>
				new Date(secondPost.date) - new Date(firstPost.date)
			);

		postsToRender.forEach(post => {
			const article = document.createElement("article");
			article.className = "post";

			const title = document.createElement("h2");
			title.className = "post-title";
			title.textContent = post.title;

			const date = document.createElement("div");
			date.className = "post-meta";
			date.textContent = post.date;

			const content = document.createElement("div");
			content.className = "post-content";
			const paragraphs = Array.isArray(post.body) ? post.body : [];
			paragraphs.forEach(paragraph => {
				const element = document.createElement("p");
				element.textContent = paragraph;
				content.appendChild(element);
			});

			article.append(title, date, content);
			postsList.appendChild(article);
		});
	})
	.catch(error => {
		document.getElementById("posts-list").textContent = error.message;
	});
</script>
</body>
</html>
