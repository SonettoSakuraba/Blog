<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<title>CSS测试</title>
<link rel="stylesheet" href="./Style.css">
</head>
<body>
<header class="site-header">
<div class="container">
<h1 class="site-title"><a href="#">我的博客</a></h1>
<nav class="site-nav">
<a href="#">首页</a>
<a href="#">关于</a>
</nav>
</div>
</header>

<main class="site-main">
<div class="container">
<article class="post">
<h2 class="post-title"><a id="post-title" href="#"></a></h2>
<div id="post-date" class="post-meta"></div>
<div id="post-body" class="post-content"></div>
</div>
</article>
</div>
</main>

<script>
fetch("./text.json")
	.then(response => {
		if (!response.ok) {
			throw new Error("无法读取 text.json");
		}
		return response.json();
	})
	.then(post => {
		document.getElementById("post-title").textContent = post.title;
		document.getElementById("post-date").textContent = post.date;

		const postBody = document.getElementById("post-body");
		post.body.forEach(paragraph => {
			const element = document.createElement("p");
			element.textContent = paragraph;
			postBody.appendChild(element);
		});
	})
	.catch(error => {
		document.getElementById("post-body").textContent = error.message;
	});
</script>
</body>
</html>
